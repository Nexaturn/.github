<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Nexaturn Technologies — Ideas, Products, A brighter tomorrow">
  <style>
    .orbit { transform-origin: 214px 190px; animation: spin 36s linear infinite; }
    .orbit-rev { transform-origin: 214px 190px; animation: spin 52s linear infinite reverse; }
    .pulse { animation: pulse 6s ease-in-out infinite; }
    .rise { opacity: 0; animation: rise 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .orbit-rev, .pulse { animation: none; }
      .rise { animation: none; opacity: 1; }
    }
    text { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#087CF0"/>
      <stop offset="55%" stop-color="#299EFF"/>
      <stop offset="100%" stop-color="#59C7FF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#59C7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#59C7FF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#59C7FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.86" cy="0.05" r="0.7">
      <stop offset="0%" stop-color="#087CF0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#087CF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.17" cy="0.5" r="0.32">
      <stop offset="0%" stop-color="#299EFF" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#299EFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7FD0FF"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity=".25"/>
    </linearGradient>
    <mask id="dotsMask"><rect width="1280" height="380" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1280" height="380" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="380" fill="#020B1C"/>
    <rect width="1280" height="380" fill="url(#glowA)" class="pulse"/>
    <rect width="1280" height="380" fill="url(#glowB)"/>
    <rect width="1280" height="380" fill="url(#dots)" opacity=".16" mask="url(#dotsMask)"/>

    <!-- large decorative arcs -->
    <circle cx="1150" cy="420" r="260" fill="none" stroke="#299EFF" stroke-opacity=".12" stroke-width="1.5"/>
    <circle cx="1150" cy="420" r="190" fill="none" stroke="#59C7FF" stroke-opacity=".10" stroke-width="1.5"/>
    <circle cx="1150" cy="420" r="120" fill="none" stroke="#59C7FF" stroke-opacity=".08" stroke-width="1.5"/>

    <!-- orbiting rings around the mark -->
    <g class="orbit">
      <circle cx="214" cy="190" r="128" fill="none" stroke="#299EFF" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 10" stroke-linecap="round"/>
      <circle cx="342" cy="190" r="5" fill="#59C7FF"/>
    </g>
    <g class="orbit-rev">
      <circle cx="214" cy="190" r="100" fill="none" stroke="#59C7FF" stroke-opacity=".18" stroke-width="1"/>
      <circle cx="214" cy="90" r="3.5" fill="#7FD0FF" fill-opacity=".9"/>
    </g>

    <!-- the Nexaturn geometric N -->
    <g transform="translate(126 102) scale(5.5)">
      <path d="M3 3h7.2l11.6 15.6V3H29v26h-7.2L10.2 13.4V29H3V3Z" fill="url(#brand)"/>
      <path d="M3 3h7.2v26H3V3Z" fill="#59C7FF"/>
    </g>

    <!-- wordmark -->
    <g class="rise">
      <text x="408" y="178" font-size="88" font-weight="700" letter-spacing="-3" fill="#FFFFFF">Nexaturn</text>
    </g>
    <g class="rise d1">
      <text x="412" y="214" font-size="15" font-weight="600" letter-spacing="7" fill="#7FD0FF">TECHNOLOGIES</text>
    </g>
    <g class="rise d2">
      <rect x="412" y="240" width="440" height="1.5" fill="url(#rule)"/>
      <text x="412" y="282" font-size="25" font-weight="500" fill="#D6EAFF">Ideas <tspan fill="#59C7FF">→</tspan> Products <tspan fill="#59C7FF">→</tspan> A brighter tomorrow</text>
    </g>
    <g class="rise d3">
      <text x="412" y="324" font-size="14" font-weight="600" letter-spacing="3" fill="#EAF4FF" fill-opacity=".55">WEB · MOBILE · DESIGN · AI · CLOUD · SAAS</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1278.5" height="378.5" rx="27.5" fill="none" stroke="#59C7FF" stroke-opacity=".18" stroke-width="1.5"/>
</svg>
