    <g class="rise">
      <rect x="56" y="46" width="22" height="3" rx="1.5" fill="url(#brand)"/>
      <text x="88" y="53" font-size="13" font-weight="700" letter-spacing="4" fill="#59C7FF">WHAT WE BUILD</text>
