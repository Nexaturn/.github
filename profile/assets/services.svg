      <rect x="674.0" y="418" width="48" height="48" rx="14" fill="#087CF0" fill-opacity=".16" stroke="#59C7FF" stroke-opacity=".3"/>
      <g transform="translate(686.0 430)" fill="none" stroke="#59C7FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6.2c0 4.6-3.4 8.3-8 9.8-4.6-1.5-8-5.2-8-9.8V5.5z"/><path d="M8.5 12l2.5 2.5 4.6-5"/></g>
