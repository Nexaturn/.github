      <text x="309.0" y="200" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2" fill="#59C7FF" fill-opacity=".45">01</text>
      <text x="80.0" y="262" font-size="20" font-weight="650" fill="#FFFFFF">Web Development</text>
